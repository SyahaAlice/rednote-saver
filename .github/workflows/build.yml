# 在 GitHub 的 macOS 机器上编译未签名的 .ipa，作为 artifact 上传并发布到 latest；
# 下载后在 Windows 上用 AltServer / Sideloadly 签名安装。
name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write  # 用来更新 latest 发布页，ipa 可直接下载

# 同一个分支连续推送时，只编译最新的那一次
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Python 官方 iOS 支持包（BeeWare 打包，CPython 3.13），固定版本并校验 SHA-256
  PY_SUPPORT_URL: https://github.com/beeware/Python-Apple-support/releases/download/3.13-b18/Python-3.13-iOS-support.b18.tar.gz
  PY_SUPPORT_SHA256: d06acf2a9c7964a8689566353a0e707402eff822037de5e29ba0e16040f7047d

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Xcode version
        run: |
          # 后台继续下载用到 iOS 26 的接口，需要 Xcode 26 以上；机器上有就选最新的正式版，没有就用默认的
          # （代码里用 #if compiler(>=6.2) 隔开了，旧版 Xcode 也能编译，只是没有后台继续）
          NEW=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE "beta|rc|preview" | sort -V | tail -1 || true)
          MAJOR=$(basename "${NEW:-Xcode_0}" .app | sed -E 's/^Xcode_([0-9]+).*/\1/')
          if [ -n "$NEW" ] && [ "$MAJOR" -ge 26 ]; then sudo xcode-select -s "$NEW/Contents/Developer"; fi
          xcodebuild -version
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"

      - name: Fetch Python for iOS
        run: |
          curl -sSL -o py.tar.gz "$PY_SUPPORT_URL"
          echo "$PY_SUPPORT_SHA256  py.tar.gz" | shasum -a 256 -c -
          tar -xzf py.tar.gz Python.xcframework
          rm py.tar.gz

      - name: Install yt-dlp, gallery-dl and certifi into app_packages
        run: |
          # gallery-dl 需要 requests（以及它依赖的 urllib3、idna），都是纯 Python。
          # 不装 charset-normalizer：它带编译好的模块，iOS 上用不了，requests 没有它也能工作
          python -m pip install --no-deps --target app_packages yt-dlp certifi gallery-dl requests urllib3 idna
          rm -rf app_packages/bin app_packages/share
          python -c "import sys; sys.path.insert(0, 'app_packages'); import gallery_dl.version as v; print('gallery-dl', v.__version__)"
          python -c "import sys; sys.path.insert(0, 'app_packages'); import yt_dlp; print('yt-dlp', yt_dlp.version.__version__)"
          # 用这次要打进包里的 yt-dlp 和 gallery-dl 跑一遍 dlcore.py 的离线测试，不通过就不发布
          python -B tools/test_dlcore.py app_packages
          # 预编译 .pyc（与手机上的 Python 3.13 同一版本），加快启动
          # 先删掉标准库里用不到的目录（test 里有故意写错语法的文件，会让预编译报错）
          STD=Python.xcframework/lib/python3.13
          rm -rf "$STD/test" "$STD/idlelib" "$STD/tkinter" "$STD/turtledemo" "$STD/ensurepip" "$STD/pydoc_data" "$STD/lib2to3"
          python -m compileall -q -j 0 --invalidation-mode unchecked-hash app app_packages Python.xcframework/lib

      - name: Build
        run: |
          set -o pipefail
          # 每次编译的版本号都不一样（1.2.运行序号），AltStore 靠它判断有没有新版
          BASE=$(grep -m1 "MARKETING_VERSION = " XHSSaver.xcodeproj/project.pbxproj | grep -oE "[0-9]+([.][0-9]+)*" | head -1)
          xcodebuild \
            -project XHSSaver.xcodeproj \
            -target XHSSaver \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            MARKETING_VERSION="${BASE:-1.2}.${GITHUB_RUN_NUMBER}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)|Installing Python|Install Python" || true
          # 把编译错误转成 GitHub 注释，在运行页面上直接能看到
          grep -E "^/.+:[0-9]+:[0-9]+: error: " build.log | sort -u | head -20 | \
            sed -E "s#^$PWD/##; s#^([^:]+):([0-9]+):([0-9]+): error: (.*)#::error file=\1,line=\2,col=\3::\4#" || true
          grep -E "error:" build.log | grep -vE "^/.+:[0-9]+:[0-9]+: error: " | sort -u | head -10 | \
            sed -E "s#^#::error::#" || true
          test -d build/Release-iphoneos/XHSSaver.app

      - name: Check app bundle
        run: |
          APP=build/Release-iphoneos/XHSSaver.app
          ls "$APP"
          # 缺了这几样的包装上也用不了：标出来并让这次编译失败，不发布
          missing=0
          test -f "$APP/Frameworks/Python.framework/Python" || { echo "::error::Python.framework 没有嵌入"; missing=1; }
          test -f "$APP/python/lib/python3.13/os.py" || { echo "::error::Python 标准库没有安装"; missing=1; }
          test -f "$APP/app/dlcore.py" || { echo "::error::dlcore.py 没有打包"; missing=1; }
          test -d "$APP/app_packages/yt_dlp" || { echo "::error::yt-dlp 没有打包"; missing=1; }
          test -d "$APP/app_packages/gallery_dl" || { echo "::error::gallery-dl 没有打包"; missing=1; }
          test -d "$APP/app_packages/requests" || { echo "::error::requests 没有打包"; missing=1; }
          # 打进包里的 Python 库不能带编译好的模块（iOS 上加载不了）
          if find "$APP/app_packages" -name "*.so" -o -name "*.dylib" | grep -q .; then
            echo "::error::app_packages 里有编译好的模块：$(find "$APP/app_packages" -name '*.so' -o -name '*.dylib' | head -3 | tr '\n' ' ')"; missing=1
          fi
          test -d "$APP/Metadata.appintents" || echo "::warning::没有生成 App Intents 元数据"
          echo "Frameworks: $(ls "$APP/Frameworks" | wc -l)"
          du -sh "$APP"
          echo "::notice::App 大小 $(du -sh "$APP" | cut -f1)，Frameworks $(ls "$APP/Frameworks" | wc -l) 个"
          test "$missing" -eq 0

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/XHSSaver.app Payload/
          zip -qry XHSSaver.ipa Payload
          ls -l XHSSaver.ipa
          # AltStore 的源文件：版本号等信息直接从刚打好的包里读
          python -B tools/make_source.py XHSSaver.ipa apps.json "$(git log -1 --pretty=%s)（${GITHUB_SHA:0:7}）"
          python -c "import json; json.load(open('apps.json', encoding='utf-8'))"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XHSSaver-ipa
          path: XHSSaver.ipa

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="最新版（$(date -u +%Y-%m-%d) · ${GITHUB_SHA:0:7}）"
          NOTES="未签名的 ipa。在 AltStore 里添加源 https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/apps.json 之后可以直接点 Update 更新；也可以把 ipa 存到手机「文件」里用 AltStore 的「+」安装。"
          if gh release view latest >/dev/null 2>&1; then
            # 原地更新：下载链接不会中途失效。先换文件，最后才改标题（标题里的 sha 变了 = 新包已就绪）
            git tag -f latest "$GITHUB_SHA"
            git push -f origin refs/tags/latest
            gh release upload latest XHSSaver.ipa --clobber
            gh release upload latest apps.json --clobber
            gh release edit latest --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          else
            gh release create latest XHSSaver.ipa apps.json --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
