# 在 GitHub 的 macOS 机器上编译未签名的 .ipa，作为 artifact 上传；
# 下载后在 Windows 上用 AltServer / Sideloadly 签名安装。
name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project XHSSaver.xcodeproj \
            -target XHSSaver \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-iphoneos/XHSSaver.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/XHSSaver.app Payload/
          ls Payload/XHSSaver.app
          ls Payload/XHSSaver.app/Metadata.appintents || echo "注意：没有生成 App Intents 元数据"
          zip -qry XHSSaver.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XHSSaver-ipa
          path: XHSSaver.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
