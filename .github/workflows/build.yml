# 在 GitHub 的 macOS 机器上编译未签名的 .ipa，作为 artifact 上传；
# 下载后在 Windows 上用 AltServer / Sideloadly 签名安装。
name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write  # 用来更新 latest 发布页，ipa 可直接下载

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project XHSSaver.xcodeproj \
            -target XHSSaver \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          # 把编译错误转成 GitHub 注释，在运行页面上直接能看到
          grep -E "^/.+:[0-9]+:[0-9]+: error: " build.log | sort -u | head -20 | \
            sed -E "s#^$PWD/##; s#^([^:]+):([0-9]+):([0-9]+): error: (.*)#::error file=\1,line=\2,col=\3::\4#" || true
          grep -E "error:" build.log | grep -vE "^/.+:[0-9]+:[0-9]+: error: " | sort -u | head -10 | \
            sed -E "s#^#::error::#" || true
          test -d build/Release-iphoneos/XHSSaver.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/XHSSaver.app Payload/
          ls Payload/XHSSaver.app
          ls Payload/XHSSaver.app/Metadata.appintents || echo "注意：没有生成 App Intents 元数据"
          zip -qry XHSSaver.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XHSSaver-ipa
          path: XHSSaver.ipa

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest XHSSaver.ipa \
            --target "$GITHUB_SHA" \
            --title "最新版（$(date -u +%Y-%m-%d) · ${GITHUB_SHA:0:7}）" \
            --notes "未签名的 ipa。下载后用 AltServer 的 Sideload .ipa 安装，或存到手机「文件」里用 AltStore 安装。"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
